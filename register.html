<!DOCTYPE html>
<html>
<head>

<title>PEPCOKE Register</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>


<header>

<div class="logo">
PEPCOKE
</div>


<nav>

<a href="index.html">Home</a>
<a href="login.html">Login</a>

</nav>

</header>




<section class="hero">

<div>

<h1>
Create Your Account
</h1>

<p>
Join PEPCOKE and start managing your financial goals.
</p>

</div>


<div class="hero-box">
👤
</div>


</section>





<section class="features">


<div class="card">


<h3>
Registration Form
</h3>



<form id="registerForm">



<input 
type="text"
id="name"
placeholder="Full Name"
required
style="padding:12px;width:100%;margin:10px 0;"
>




<input 
type="email"
id="regEmail"
placeholder="Email Address"
required
style="padding:12px;width:100%;margin:10px 0;"
>




<input 
type="password"
id="regPassword"
placeholder="Create Password"
required
style="padding:12px;width:100%;margin:10px 0;"
>




<input 
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required
style="padding:12px;width:100%;margin:10px 0;"
>




<br>

<button>
Create Account
</button>


</form>



<p style="margin-top:20px;">

Already have an account?

<a href="login.html">
Login
</a>

</p>


</div>


</section>





<footer>

<p>
© 2026 PEPCOKE. All Rights Reserved.
</p>

</footer>



<script src="script.js"></script>


</body>
</html>
