<!DOCTYPE html>
<html>
<head>

<title>Deposit Funds - PEPCOKE</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
PEPCOKE
</div>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="plans.html">Plans</a>

</nav>

</header>

<section class="hero">

<div>

<h1>Deposit Funds</h1>

<p>
Add money to your PEPCOKE investment account.
</p>

</div>

<div class="hero-box">
💳
</div>

</section>

<section class="features">

<div class="card">

<h3>Make a Deposit</h3>

<form id="depositForm">

<input
type="number"
id="amount"
placeholder="Enter Amount (GH₵)"
required
style="padding:12px;width:100%;margin:10px 0;"
>

<select
id="paymentMethod"
style="padding:12px;width:100%;margin:10px 0;"
>

<option>MTN Mobile Money</option>
<option>Telecel Cash</option>
<option>AirtelTigo Money</option>
<option>Bank Transfer</option>

</select>

<button type="submit">
Continue
</button>

</form>

</div>

</section>

<footer>

<p>
© 2026 PEPCOKE. All Rights Reserved.
</p>

</footer>

<script>

document.getElementById("depositForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const token = localStorage.getItem("token");

    const amount = document.getElementById("amount").value;
    const paymentMethod = document.getElementById("paymentMethod").value;

    try {

        const response = await fetch(
            "https://22411b5c-070d-4ace-baf5-1cd9c737da6c-00-dpewii9evv7.spock.replit.dev/api/deposits",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    amount,
                    paymentMethod
                })
            }
        );

        const data = await response.json();

        if (response.ok) {

            alert("Deposit request submitted successfully.");

            window.location.href = "dashboard.html";

        } else {

            alert(data.error || "Deposit failed.");

        }

    } catch (error) {

        console.error(error);

        alert("Cannot connect to PEPCOKE server.");

    }

});

</script>

</body>
</html>
