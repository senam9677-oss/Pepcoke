<!DOCTYPE html>
<html>
<head>

<title>PEPCOKE Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>


<header>

<div class="logo">
PEPCOKE
</div>


<nav>

<a href="index.html">Home</a>
<a href="register.html" class="btn">Register</a>

</nav>

</header>




<section class="hero">

<div>

<h1>
Welcome Back
</h1>

<p>
Login to access your PEPCOKE account.
</p>

</div>


<div class="hero-box">
🔐
</div>


</section>





<section class="features">


<div class="card">


<h3>
Account Login
</h3>


<form id="loginForm">


<input 
type="email"
id="email"
placeholder="Email Address"
required
style="padding:12px;width:100%;margin:10px 0;"
>


<input 
type="password"
id="password"
placeholder="Password"
required
style="padding:12px;width:100%;margin:10px 0;"
>


<br>


<button>
Login
</button>


</form>



<p style="margin-top:20px;">

Don't have an account?

<a href="register.html">
Register
</a>

</p>


</div>


</section>




<footer>

<p>
© 2026 PEPCOKE. All Rights Reserved.
</p>

</footer>



<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch(
            "https://22411b5c-070d-4ace-baf5-1cd9c737da6c-00-dpewii9evv7.spock.replit.dev/api/auth/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    password
                })
            }
        );

        const data = await response.json();

        if (response.ok) {

            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));

            alert("Login successful!");

            window.location.href = "dashboard.html";

        } else {

            alert(data.error || "Invalid email or password");

        }

    } catch (error) {

        console.error(error);
        alert("Cannot connect to PEPCOKE server");

    }

});
</script>


</body>
</html>
