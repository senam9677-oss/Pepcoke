<!DOCTYPE html>
<html>
<head>

<title>PEPCOKE Plans</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
PEPCOKE
</div>

<nav>

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="plans.html">Plans</a>
<a href="contact.html">Contact</a>
<a href="login.html">Login</a>
<a href="register.html" class="btn">Register</a>

</nav>

</header>

<section class="hero">

<div>

<h1>
Financial Planning Options
</h1>

<p>
Choose the investment plan that matches your financial goals.
</p>

</div>

<div class="hero-box">
📈
</div>

</section>

<section class="features">

<h2>
Available Investment Plans
</h2>

<div class="cards" id="plansContainer">

<p>Loading investment plans...</p>

</div>

</section>

<footer>

<p>
© 2026 PEPCOKE. All Rights Reserved.
</p>

</footer>

<script>

async function loadPlans() {

    try {

        const response = await fetch(
            "https://22411b5c-070d-4ace-baf5-1cd9c737da6c-00-dpewii9evv7.spock.replit.dev/api/plans"
        );

        const plans = await response.json();

        let html = "";

        plans.forEach(plan => {

            html += `
            <div class="card">

                <h3>${plan.name}</h3>

                <h2>GH₵${plan.minimumAmount}</h2>

                <p><strong>Minimum Investment</strong></p>

                <p>Duration: ${plan.duration} days</p>

                <p><strong>Total Return:</strong> GH₵${plan.totalReturn}</p>

                <p>${plan.description}</p>

                <button onclick="location.href='login.html'">
                    Invest Now
                </button>

            </div>
            `;

        });

        if (plans.length === 0) {

            html = "<p>No investment plans are available yet.</p>";

        }

        document.getElementById("plansContainer").innerHTML = html;

    } catch (error) {

        console.log(error);

        document.getElementById("plansContainer").innerHTML =
            "<p>Unable to load investment plans.</p>";

    }

}

loadPlans();

</script>

</body>
</html>
